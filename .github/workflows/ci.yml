name: Validación
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --wait db
      - run: docker compose build backend
      - run: docker compose run --rm backend python manage.py test --noinput
      - run: docker compose run --rm backend python manage.py makemigrations --check --dry-run
      - run: docker compose run --rm -e DJANGO_DEBUG=False -e DJANGO_SECRET_KEY=ci-deployment-check-only-value-with-more-than-fifty-characters-2026 backend python manage.py check --deploy --fail-level WARNING
      - run: docker compose run --rm --user root backend sh -c 'pip install pip-audit && pip-audit -r requirements.txt'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T backend python manage.py import_badata_recorridos --geojson --file /data/recorridos.variants.sample.geojson
      - run: docker compose exec -T backend python manage.py import_badata_paradas --file /data/paradas.catalogue.sample.geojson --match-routes
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
